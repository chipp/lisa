[package]
name = "crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.9"
cbc = "0.2"
ecb = "0.2.0"
cipher = { version = "0.5", features = ["block-padding"] }

md-5 = "0.11"

[dev-dependencies]
hex-literal = "1.1"
