[package]
name = "inspinia"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
log = "0.4"

tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
futures-util = "0.3"

chipp_http = "1.3"

crypto = { path = "../crypto" }

rusqlite = "0.40"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

chrono = { version = "0.4", features = ["std", "clock"], default-features = false }
chrono-humanize = "0.2"

zip = { version = "9.0", default-features = false, features = ["deflate"] }
