[package]
name = "tuya"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
crypto = { path = "../crypto" }
transport = { path = "../transport" }

log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }
